# .github/dependabot.yml
# Konfigurasi Dependabot untuk repo dengan PHP (Composer), Node.js (npm),
# Golang (Go modules), GitHub Actions, dan Dockerfile.
#
# Catatan: Dependabot config berlaku PER-REPOSITORY, bukan org-level.
# Letakkan file ini di .github/dependabot.yml pada setiap repository.
# Ecosystem yang tidak dipakai di suatu repo akan diabaikan otomatis
# (tidak error), jadi template ini aman dipakai di semua repo organisasi.

version: 2

updates:
  # ── PHP / Composer ──────────────────────────────────────────────
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "php"
    commit-message:
      prefix: "deps(composer)"
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ── Node.js / npm (juga mendukung yarn & pnpm) ─────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nodejs"
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ── Golang / Go modules ────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "golang"
    commit-message:
      prefix: "deps(go)"
    groups:
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions-all:
        patterns:
          - "*"

  # ── Docker / Dockerfile ────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
